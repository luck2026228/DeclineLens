<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DeclineLens</title>
<style>
  :root {
    --bg: #0f1113; --bg2: #14171a; --line: #232628; --line2: #2a2e33;
    --fg: #e8e8e8; --dim: #666; --green: #9acd32; --red: #ff6b6b;
    --blue: #5b8dd9; --gold: #ffd166;
  }
  * { box-sizing: border-box; }
  body {
    width: 460px; margin: 0; background: var(--bg); color: var(--fg);
    font-family: "Microsoft YaHei", "PingFang SC", -apple-system, sans-serif;
  }
  header {
    padding: 12px 16px; background: linear-gradient(135deg, #1a1d20, #22262b);
    font-weight: 700; display: flex; justify-content: space-between;
    align-items: center; border-bottom: 1px solid var(--line2);
  }
  header .logo { color: var(--green); }
  .btns button {
    background: var(--line2); color: #ccc; border: 0; padding: 5px 12px;
    border-radius: 5px; cursor: pointer; font-size: 12px; margin-left: 6px;
  }
  .btns button:hover { background: #3a3e43; }

  #stats {
    display: flex; gap: 18px; padding: 10px 16px; background: var(--bg2);
    font-size: 12px; color: #888; border-bottom: 1px solid var(--line);
  }
  #stats b { color: var(--fg); font-size: 14px; }

  /* 注入失败提醒条：默认隐藏，content.js 报了 hookFail 才显示 */
  #hookwarn {
    display: none; padding: 8px 16px; background: #241a12; color: #ffb066;
    font-size: 12px; line-height: 1.6; border-bottom: 1px solid var(--line);
  }

  #list { max-height: 460px; overflow-y: auto; }
  #list::-webkit-scrollbar { width: 6px; }
  #list::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 3px; }

  .item { border-bottom: 1px solid #1e2124; padding: 12px 16px; }
  .item:hover { background: #15181b; }
  .row1 { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; }
  .code { color: var(--red); font-weight: 700; font-family: Consolas, monospace; word-break: break-all; }
  .site { color: var(--blue); font-size: 11px; font-family: Consolas, monospace; }
  .amt  { color: var(--gold); font-size: 11px; font-family: Consolas, monospace; }

  /* Stripe 自己给的 advice_code —— 唯一不是我们推断出来的结论，所以给它
     独立的视觉层级，别跟我们的建议混在一起 */
  .official {
    margin-top: 7px; padding: 6px 10px; background: #16191c;
    border-left: 3px solid var(--gold); border-radius: 0 5px 5px 0;
    font-size: 12px; color: #bbb; line-height: 1.6;
  }
  .official .oflag { font-weight: 700; }

  .advice {
    color: var(--green); font-size: 13px; margin-top: 6px; line-height: 1.7;
    background: #131a10; padding: 7px 10px; border-radius: 5px;
  }
  .tags { margin-top: 6px; }
  .tag {
    display: inline-block; font-size: 10px; color: #7a8288; background: #1a1e22;
    border: 1px solid var(--line2); border-radius: 3px; padding: 1px 6px;
    margin-right: 5px; font-family: Consolas, monospace;
  }
  .msg { color: #999; font-size: 12px; margin-top: 6px; word-break: break-all; }
  .time { color: #555; font-size: 11px; margin-top: 5px; }

  .empty { padding: 44px 20px; text-align: center; color: #555; line-height: 2; }
  .empty .dim { font-size: 12px; color: #3d4145; }

  footer {
    padding: 9px 16px; border-top: 1px solid var(--line); background: var(--bg2);
    font-size: 11px; color: var(--dim); display: flex;
    justify-content: space-between; align-items: center;
  }
  footer a { color: #7f8a95; text-decoration: none; }
  footer a:hover { color: var(--green); text-decoration: underline; }
</style>
</head>
<body>

<header>
  <span class="logo">🔍 DeclineLens 拒付透视镜</span>
  <span class="btns">
    <button id="copy">📋 复制报告</button>
    <button id="clear">清空</button>
  </span>
</header>

<div id="stats">
  <span>捕获总数 <b id="statTotal">0</b></span>
  <span>最常见原因 <b id="statTop">—</b></span>
</div>

<div id="hookwarn"></div>

<div id="list"></div>

<footer>
  <span>🔒 纯本地运行，无任何上传</span>
  <a id="repo" href="#" target="_blank" rel="noopener noreferrer">遇到未收录的码？发个 issue →</a>
</footer>

<!-- dict.js 必须排在 popup.js 之前：字典、诊断、转义都在里面 -->
<script src="dict.js"></script>
<script src="popup.js"></script>
</body>
</html>
