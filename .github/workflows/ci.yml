name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 最小权限：这个流程只读代码，什么都不写。
# 不写这一段的话，GITHUB_TOKEN 默认可能拿到写权限 —— 用不上的权限就不该给。
permissions:
  contents: read

concurrency:
  # 同一个分支连续推几次时，只留最后一次；前面还在跑的直接取消，不浪费额度
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 自检（构建 + 全部断言）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: 重新构建（验证提交的 .user.js 与源码同步）
        run: python build.py

      - name: 提交的 DeclineLens.user.js 必须与构建产物一致
        run: |
          if ! git diff --quiet -- DeclineLens.user.js; then
            echo "::error::DeclineLens.user.js 与源码不同步。请在本地跑 python build.py 并提交结果。"
            git diff --stat -- DeclineLens.user.js
            exit 1
          fi
          echo "OK：生成物与源码一致"

      - name: 跑自检
        run: node test.js

      - name: 语法检查所有 JS
        run: |
          for f in content.js pagehook.js dict.js popup.js DeclineLens.user.js test.js; do
            node --check "$f" || exit 1
            echo "  ok  $f"
          done

      - name: 版本号必须四处一致
        run: |
          python - <<'PY'
          import json, io, sys, re
          a = json.load(io.open("manifest.json", encoding="utf-8"))
          b = json.load(io.open("manifest.firefox.json", encoding="utf-8"))
          p = json.load(io.open("package.json", encoding="utf-8"))
          assert a["version"] == b["version"], ("firefox 清单", a["version"], b["version"])
          assert a["version"] == p["version"], ("package.json", a["version"], p["version"])
          us = io.open("DeclineLens.user.js", encoding="utf-8").read()
          m = re.search(r"@version\s+(\S+)", us)
          assert m and m.group(1) == a["version"], ("油猴 @version", m and m.group(1), a["version"])
          sys.stdout.write("OK: version %s 四处一致（manifest / firefox 清单 / package.json / 油猴 @version）\n"
                           % a["version"])
          PY

      - name: 文档体检（占位符 / 损坏字符 / 内部死链）
        run: python check_docs.py
